<a class="skip-link" href="#contenuto" (click)="vaiAlContenuto($event)">Salta al contenuto</a>

@if (isLoggedIn()) {
  <header>
    <nav class="navbar" aria-label="Principale">
      <span class="brand">AssetManagement</span>

      <div class="links">
        <a routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">Home</a>
        <a routerLink="/assets" routerLinkActive="active" ariaCurrentWhenActive="page">Asset</a>
        <a routerLink="/maintenance" routerLinkActive="active" ariaCurrentWhenActive="page">Manutenzioni</a>
      </div>

      <button type="button" class="logout" (click)="logout()">Esci</button>
    </nav>
  </header>
}

<main id="contenuto" tabindex="-1">
  <router-outlet />
</main>
