<div class="login-container">
  <form #formEl [formGroup]="form" (ngSubmit)="submit(formEl)">
    <h1>Accedi</h1>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" required
        [attr.aria-invalid]="errore('email') ? 'true' : null"
        [attr.aria-describedby]="errore('email') ? 'login-email-errore' : null" />
    </label>
    @if (errore('email')) {
      <p id="login-email-errore" class="field-error">Inserisci un indirizzo email valido.</p>
    }

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" required
        [attr.aria-invalid]="errore('password') ? 'true' : null"
        [attr.aria-describedby]="errore('password') ? 'login-password-errore' : null" />
    </label>
    @if (errore('password')) {
      <p id="login-password-errore" class="field-error">Inserisci la password.</p>
    }

    <!-- role="alert": "Credenziali non valide" viene letto appena compare -->
    <div role="alert">
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
    </div>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Accesso...' : 'Accedi' }}
    </button>
    <p class="auth-switch">Non hai un account? <a routerLink="/register">Registrati</a></p>
  </form>
</div>
